  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e8e8ed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #fff;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 720px;
      background: #1a1a22;
      border: 1px solid #2a2a35;
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    textarea {
      width: 100%;
      min-height: 320px;
      background: #121218;
      color: #c8c8d0;
      border: 1px solid #2a2a35;
      border-radius: 8px;
      padding: 1rem;
      font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }
    textarea:focus {
      border-color: #5b5bf0;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    button {
      background: #5b5bf0;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: #4a4ad8;
    }
    button:active {
      background: #3d3db8;
    }
    #status {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #7d7d95;
      min-height: 1.2em;
    }
    #status.success {
      color: #4ade80;
    }
  </style>

    <div class="actions">
      <button onclick="copySettings()">Copy to clipboard</button>
      <button onclick="selectAll()" style="background:#2a2a35;">Select all</button>
    </div>
    <div id="status"></div>
  </div>

  <script>
    function copySettings() {
      const ta = document.getElementById('settings');
      ta.select();
      navigator.clipboard.writeText(ta.value).then(() => {
        const status = document.getElementById('status');
        status.textContent = 'Copied!';
        status.className = 'success';
        setTimeout(() => {
          status.textContent = '';
          status.className = '';
        }, 2000);
      }).catch(() => {
        // fallback for older browsers
        document.execCommand('copy');
        const status = document.getElementById('status');
        status.textContent = 'Copied!';
        status.className = 'success';
        setTimeout(() => {
          status.textContent = '';
          status.className = '';
        }, 2000);
      });
    }

    function selectAll() {
      const ta = document.getElementById('settings');
      ta.focus();
      ta.select();
    }
  </script>
